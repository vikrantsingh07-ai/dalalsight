[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dalalsight"
version = "0.1.0"
description = "DalalSight: Indian-market research dashboard, analysis engines and agent orchestration on TradingAgents India (packages/tradingagents)"
requires-python = ">=3.11"
dependencies = [
    "tradingagents",  # install from packages/tradingagents: pip install -e packages/tradingagents
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "yfinance>=0.2.50",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-subtests>=0.13", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-requests"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["cc*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend"]
# packages/tradingagents keeps the upstream project's own lint settings
extend-exclude = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "backend"
packages = ["cc"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
